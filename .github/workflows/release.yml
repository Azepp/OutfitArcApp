name: Build & Release APK

on:
  push:
    tags:
      - "v*"  # trigger saat push tag seperti v1.0.0

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Setup EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Build APK
        run: eas build --platform android --profile preview --non-interactive

      - name: Get APK URL
        id: build
        run: |
          APK_URL=$(eas build:list --platform android --limit 1 --json | jq -r '.[0].artifacts.buildUrl')
          echo "apk_url=$APK_URL" >> $GITHUB_OUTPUT

      - name: Download APK
        run: curl -L "${{ steps.build.outputs.apk_url }}" -o outfitarc.apk

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: outfitarc.apk
          name: "OutfitArc ${{ github.ref_name }}"
          body: |
            ## OutfitArc ${{ github.ref_name }}
            
            Download APK di bawah untuk install langsung di Android.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          